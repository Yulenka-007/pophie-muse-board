    const label=s.channel_key==='facebook'?'单帖覆盖':'浏览／播放';
    const number=s.channel_key==='facebook'?s.reach:s.views;
    return `<article class=sa-card id="sa-${h(s.id)}">${files.length?`<img loading=lazy class=sa-cover src="${h(files[0])}" alt="${h(s.author)} 的投稿图片" data-sa-image="${h(files[0])}">`:''}<div class=sa-body><div class=sa-byline><span class=sa-channel>${h(s.source_channel)}</span><b>${h(s.author)}</b></div><div class=sa-note>${h(date(s))}</div><h3>${h(s.title)}</h3>${s.highlight?`<p class=sa-highlight>${h(s.highlight)}</p>`:''}${s.review_note?`<p class=sa-review>${h(s.review_note)}</p>`:''}<div class=sa-metrics><div>点赞／表情<b>${val(s.reactions)}</b></div><div>评论／回复<b>${val(s.comments)}</b></div><div>可见互动${s.interaction_complete?'':'下限'}<b>${s.interaction_complete?'':'≥'}${val(s.interaction_total)}</b></div><div>${label}<b>${val(number)}</b></div></div>${files.length>1?`<div class=sa-gallery>${files.map((f,i)=>`<button data-sa-image="${h(f)}" aria-label="查看第 ${i+1} 张图片"><img loading=lazy src="${h(f)}" alt="${h(s.author)} 配图 ${i+1}"></button>`).join('')}</div>`:''}<div class=sa-note>${files.length?'本地已保存 '+files.length+' 张图片。':''}${h(s.media_note||'')}</div>${videos.length?`<div class=sa-links>${videos.map((v,i)=>`<a target=_blank rel=noopener href="${h(v)}">▶ 视频 ${i+1} ↗</a>`).join('')}</div>`:''}<details><summary>${s.content_type==='video'?'视频标题与已核验简介':'查看完整原文'}</summary>${s.text_scope?`<p class=sa-note>${h(s.text_scope)}</p>`:''}<div class=sa-copy>${h(s.text)}</div></details><details><summary>中文${s.translation_mode==='full'?'译文':'参考（历史译稿）'}</summary><div class="sa-copy zh">${h(s.translation)}</div></details>${s.related_ids?.length?`<div class=sa-related>同一故事的其他发布版本：${s.related_ids.map(id=>{const r=rows.find(x=>x.id===id);return `<a href="#sa-${h(id)}" data-sa-jump="${h(id)}">${h(r.source_channel)} · ${h(r.author)}</a>`;}).join(' / ')}</div>`:''}<div class=sa-links><a target=_blank rel=noopener href="${h(s.url)}">查看原帖 ↗</a></div><p class=sa-note>互动为 9/22 核查时页面累计显示值；未显示不等于零。</p></div></article>`;
  }
  function render(){
    const term=host.querySelector('[data-sa-search]').value.toLowerCase(),channel=host.querySelector('[data-sa-channel]').value,scope=host.querySelector('[data-sa-scope]').value,sort=host.querySelector('[data-sa-sort]').value;
    displayed=rows.filter(r=>(channel==='all'||r.channel_key===channel)&&(scope==='all'||(scope==='review'?r.review_note:r.entry_status==='campaign'))&&[r.author,r.title,r.text,r.translation].join(' ').toLowerCase().includes(term));
    displayed.sort((a,b)=>sort==='latest'?new Date(b.date)-new Date(a.date):((sort==='reactions'?(b.reactions??-1):(b.interaction_total??-1))-(sort==='reactions'?(a.reactions??-1):(a.interaction_total??-1))));
    host.querySelector('[data-sa-grid]').innerHTML=displayed.map(card).join('').replaceAll('≥未显示','未显示')||'<div class=sa-empty>没有符合当前筛选的记录。</div>';
    host.querySelector('[data-sa-count]').textContent=`当前显示 ${displayed.length} 条发布 · ${new Set(displayed.map(r=>r.story_group)).size} 个故事组。跨发版本分别展示，不重复计算独立故事。`;
  }
  host.addEventListener('input',e=>{if(e.target.matches('[data-sa-search]'))render()});host.addEventListener('change',e=>{if(e.target.matches('select'))render()});
  host.addEventListener('click',e=>{
    const pic=e.target.closest('[data-sa-image]');if(pic){const d=host.querySelector('dialog');d.querySelector('img').src=pic.dataset.saImage;d.querySelector('a').href=pic.dataset.saImage;d.showModal();}
    if(e.target.closest('[data-sa-close]'))host.querySelector('dialog').close();
    const jump=e.target.closest('[data-sa-jump]');if(jump){e.preventDefault();host.querySelector('[data-sa-channel]').value='all';host.querySelector('[data-sa-scope]').value='all';host.querySelector('[data-sa-search]').value='';render();host.querySelector('#sa-'+CSS.escape(jump.dataset.saJump))?.scrollIntoView({behavior:'smooth',block:'start'});}
    if(e.target.closest('[data-sa-export]')){
      const headers=['id','story_group','source_channel','author','title','date','date_label','reactions','comments','interaction_total','interaction_complete','reach','views','entry_status','review_note','url','text','translation','translation_mode','media','video_urls','checked_at'];
      const cell=v=>{let t=Array.isArray(v)?v.join('\n'):String(v??'');if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};
      const csv='\uFEFF'+[headers,...displayed.map(r=>headers.map(k=>r[k]))].map(r=>r.map(cell).join(',')).join('\r\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='Pophie-Story-2026-09-22.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }
  });
  render();
  const tile=document.querySelector('.oh-campaign.story');if(tile){tile.querySelector('.oh-kicker').textContent='CAMPAIGN CLOSED · 已结束';tile.querySelector('p').textContent='投稿交付档案 · FB、官网及可核验外部视频统一归档。';tile.querySelector('b').textContent=stats.campaign_publications+' 条发布 / '+stats.story_groups+' 个故事组';}
  if(location.hash==='#pophie-story')document.querySelector('[data-tab=pophie_story]')?.click();
})();
</script></html>
